<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--head:#1f3864;--sub:#d9e1f2;--yel:#fff200;--line:#a6a6a6;--bg:#f4f6fa;--ink:#1d1d1f;--mut:#6b7280;--ok:#2e7d32;--warn:#b26a00;--bad:#c62828;--done:#9e9e9e}
*{box-sizing:border-box}
body{margin:0;font-family:"Meiryo UI","Hiragino Sans","Yu Gothic UI",sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
header.top{display:flex;align-items:center;gap:14px;background:var(--head);color:#fff;padding:8px 14px;flex-wrap:wrap}
header.top b{font-size:15px}
#tabs{display:flex;gap:4px}
#tabs button{background:transparent;color:#cfd8ea;border:1px solid transparent;border-radius:4px;padding:5px 12px;font:inherit;cursor:pointer}
#tabs button.on{background:#fff;color:var(--head);font-weight:bold}
#meta{margin-left:auto;font-size:11px;color:#cfd8ea}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid #dde}
.filters label{font-size:12px;color:var(--mut)}
select,input,textarea,button{font:inherit}
select,input[type=text],input[type=date],input[type=number]{border:1px solid #c5cbd6;border-radius:4px;padding:4px 6px;background:#fff}
button.pri{background:var(--head);color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
button.sec{background:#fff;color:var(--head);border:1px solid var(--head);border-radius:4px;padding:5px 10px;cursor:pointer}
main{padding:12px 14px}
.hint{font-size:11px;color:var(--mut)}
/* ボード */
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(220px,1fr));gap:10px;align-items:start}
.col{background:#e9edf4;border-radius:6px;padding:6px;min-height:200px}
.col.over{outline:2px dashed var(--head)}
.col h3{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.card{background:#fff;border:1px solid #d5dae3;border-left:4px solid #9aa5b8;border-radius:5px;padding:7px 8px;margin-bottom:6px;cursor:grab}
.card.p-高{border-left-color:var(--bad)}.card.p-中{border-left-color:#e0a100}.card.p-低{border-left-color:#7da7d9}
.card.dragging{opacity:.4}
.c-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.c-name{font-weight:bold;margin:3px 0}
.c-meta,.c-foot{font-size:11px;color:var(--mut)}
.badge{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid}
.j-ok{color:var(--ok);border-color:var(--ok)}.j-warn{color:var(--warn);border-color:var(--warn);background:#fff6e0}
.j-bad{color:#fff;background:var(--bad);border-color:var(--bad)}.j-done{color:var(--done);border-color:var(--done)}
.bar{height:5px;background:#e6e9ef;border-radius:3px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.over{background:var(--bad)}.bar i.warn{background:#e0a100}
.overdue{color:var(--bad);font-weight:bold}
/* ガント */
.gwrap{overflow:auto;background:#fff;border:1px solid var(--line);max-height:calc(100vh - 150px)}
.grow{display:flex;min-width:max-content;border-bottom:1px solid #eceff4}
.glabel{position:sticky;left:0;z-index:2;background:#fff;width:320px;flex:none;padding:4px 8px;border-right:1px solid var(--line);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.glabel .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.gtl{position:relative;flex:none;height:28px}
.ghead{position:sticky;top:0;z-index:3;background:var(--head);color:#fff}
.ghead .glabel{background:var(--head);color:#fff;font-weight:bold}
.ghead .gtl{height:36px}
.gday{position:absolute;top:0;height:100%;font-size:10px;text-align:center;border-left:1px solid rgba(255,255,255,.15);padding-top:18px}
.gmon{position:absolute;top:2px;font-size:11px;font-weight:bold;padding-left:3px;white-space:nowrap}
.gsec{background:#3a4f7a;color:#fff;font-weight:bold}
.gsec .glabel{background:#3a4f7a;color:#fff}
.gbar{position:absolute;top:6px;height:16px;border-radius:3px;background:#7da7d9;overflow:hidden;cursor:pointer;font-size:10px;color:#fff;padding-left:4px;white-space:nowrap}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.22)}
.gbar span{position:relative}
.gbar.s-進行中{background:#3f7fd1}.gbar.s-確認待ち{background:#8e6bc2}.gbar.s-完了{background:#a8a8a8}.gbar.bad{background:var(--bad)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:#ff5252;z-index:1}
/* 表（価格一覧表スタイル） */
table.pt{border-collapse:collapse;background:#fff;width:100%;font-size:12px}
table.pt th,table.pt td{border:1px solid var(--line);padding:3px 6px}
table.pt th{background:var(--head);color:#fff;font-weight:bold;text-align:center}
table.pt th.s{background:var(--sub);color:#000}
table.pt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.pt td.c{text-align:center}
table.pt td:first-child{white-space:nowrap}
table.pt tr.sec td{background:#3a4f7a;color:#fff;font-weight:bold}
table.pt tr.tot td{background:var(--sub);font-weight:bold}
table.pt .hl{background:var(--yel)}
.hb{display:flex;align-items:center;gap:6px}
.hb i{display:inline-block;height:10px;background:#3f7fd1;border-radius:2px}
.hb i.b{background:#e08a1e}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.panel{background:#fff;border:1px solid #dde;border-radius:6px;padding:10px}
.panel h4{margin:0 0 8px;font-size:13px;color:var(--head)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #dde;border-radius:6px;padding:10px}
.kpi .v{font-size:22px;font-weight:bold;color:var(--head)}
.kpi .l{font-size:11px;color:var(--mut)}
.kpi.alert .v{color:var(--bad)}
/* 日報 */
.daily{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,2fr);gap:14px}
.daily textarea{width:100%;min-height:160px;border:1px solid #c5cbd6;border-radius:4px;padding:6px}
pre.sum{white-space:pre-wrap;background:#f7f8fb;border:1px solid #e3e6ee;border-radius:4px;padding:8px;font-family:inherit;font-size:12px;margin:0 0 10px}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 10px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:8px;width:min(560px,100%);padding:16px}
.mbox h3{margin:0 0 10px;color:var(--head)}
.fgrid{display:grid;grid-template-columns:110px 1fr;gap:7px 10px;align-items:center}
.fgrid input,.fgrid select,.fgrid textarea{width:100%}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.idbox{background:#f1f4fa;border:1px dashed #9aa5b8;border-radius:4px;padding:6px 8px;font-size:12px;margin-bottom:10px}
/* 業務ツリー */
table.pt tr.lv-大 td{background:#1f3864;color:#fff;font-weight:bold}
table.pt tr.lv-中 td{background:#d9e1f2;font-weight:bold}
table.pt tr.lv-個別 td{color:#555;font-style:italic}
table.pt tr.lv-大 td.hl{color:#000}
.tg{cursor:pointer;user-select:none;display:inline-block;width:14px}
.pv{display:inline-block;height:8px;border-radius:2px;background:#3f7fd1;vertical-align:middle}
.pv.over{background:var(--bad)}.pv.under{background:#9aa5b8}
td.dpos{color:var(--bad);font-weight:bold}td.dneg{color:#1565c0}
/* 週カレンダー */
.week{display:grid;grid-template-columns:44px repeat(7,minmax(90px,1fr));background:#fff;border:1px solid var(--line);overflow:auto;max-height:calc(100vh - 210px)}
.wk-h{position:sticky;top:0;z-index:3;background:var(--head);color:#fff;text-align:center;font-weight:bold;padding:4px 2px;font-size:12px;border-left:1px solid #3a4f7a}
.wk-h.today{background:#c62828}
.wk-h small{display:block;font-weight:normal;font-size:10px;color:#cfd8ea}
.wk-t{position:relative;border-right:1px solid var(--line)}
.wk-t div{position:absolute;right:4px;font-size:10px;color:var(--mut);transform:translateY(-6px)}
.wk-d{position:relative;border-left:1px solid #e3e6ee;background-image:repeating-linear-gradient(180deg,#eceff4 0 1px,transparent 1px 40px)}
.wk-d.we{background-color:#f7f8fb}
.ev{position:absolute;border-radius:4px;padding:2px 4px;font-size:10px;line-height:1.25;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.15);color:#fff}
.ev b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.unc{background:var(--yel)!important;color:#000;border-color:#b8a800}
.ev.exc{background:repeating-linear-gradient(45deg,#e0e0e0 0 6px,#f2f2f2 6px 12px)!important;color:#666}
.ev.man{box-shadow:inset 3px 0 0 #111}
table.pt select{font-size:12px;padding:1px 2px;max-width:200px}
.acc{font-size:11px;padding:1px 8px;border-radius:9px;border:1px solid;white-space:nowrap}
.acc-ok{color:var(--ok);border-color:var(--ok)}.acc-ro{color:#1565c0;border-color:#1565c0}.acc-ng{color:#fff;background:var(--bad);border-color:var(--bad)}.acc-na{color:var(--mut);border-color:#bbb}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.info{background:#fffbe6;border:1px solid #f0d36a;border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px;line-height:1.7}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:5px;display:none;z-index:60;font-size:12px}
#loading{padding:40px;text-align:center;color:var(--mut)}
@media (max-width:700px){.board{grid-template-columns:1fr}.glabel{width:170px}.daily{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <b>工数・タスク管理</b>
  <nav id="tabs">
    <button data-v="board" class="on">ボード</button>
    <button data-v="gantt">ガント</button>
    <button data-v="dash">予実・工数</button>
    <button data-v="daily">日報</button>
    <button data-v="cal">カレンダー</button>
    <button data-v="admin" id="tabAdmin" hidden>管理</button>
  </nav>
  <span id="meta"></span>
</header>
<div class="filters" id="filters">
  <label>担当者</label><select id="fOwner"><option value="">すべて</option></select>
  <label>部署</label><select id="fDept"><option value="">すべて</option></select>
  <label>案件</label><select id="fProj"><option value="">すべて</option></select>
  <input type="text" id="fQ" placeholder="キーワード" size="12">
  <label><input type="checkbox" id="fDone"> 完了も表示</label>
  <span style="flex:1"></span>
  <button class="pri" id="btnNew">＋ タスク追加</button>
  <button class="sec" id="btnReload">再読込</button>
</div>
<main>
  <div id="loading">読み込み中…</div>
  <section id="v-board" hidden></section>
  <section id="v-gantt" hidden></section>
  <section id="v-dash" hidden>
    <div class="filters" style="border:1px solid #dde;border-radius:6px;margin-bottom:12px">
      <label>期間</label>
      <select id="dPreset"><option value="m0">今月</option><option value="m1">先月</option><option value="w4">直近4週</option><option value="w12">直近12週</option><option value="c">期間指定</option></select>
      <input type="date" id="dFrom"> 〜 <input type="date" id="dTo">
      <button class="pri" id="dGo">集計</button>
      <span class="hint" id="dInfo"></span>
    </div>
    <div id="dashBody"></div>
  </section>
  <section id="v-daily" hidden>
    <div class="filters" style="border:1px solid #dde;border-radius:6px;margin-bottom:12px">
      <label>氏名</label><select id="rName"></select>
      <button class="sec" id="rPrev">◀ 前日</button>
      <input type="date" id="rDate">
      <button class="sec" id="rNext">翌日 ▶</button>
      <button class="pri" id="rGo">表示</button>
    </div>
    <div id="dailyBody"></div>
  </section>
  <section id="v-cal" hidden>
    <div class="filters" style="border:1px solid #dde;border-radius:6px;margin-bottom:12px">
      <label>氏名</label><select id="cName"></select>
      <button class="sec" id="cPrev">◀ 前週</button>
      <button class="sec" id="cThis">今週</button>
      <button class="sec" id="cNext">翌週 ▶</button>
      <b id="cRange"></b>
      <span class="hint" id="cAccess"></span>
      <span style="flex:1"></span>
      <button class="pri" id="cNew">＋ 予定を追加</button>
    </div>
    <div id="calBody"></div>
  </section>
  <section id="v-admin" hidden><div id="adminBody"></div></section>
</main>

<div class="modal" id="emodal">
  <div class="mbox">
    <h3 id="eTitle">予定</h3>
    <div class="idbox" id="eNote" hidden></div>
    <div class="fgrid">
      <label>件名 *</label><input type="text" id="eName">
      <label>日付</label><input type="date" id="eDate">
      <label>時間</label><span><input type="time" id="eStart" step="300" style="width:auto"> 〜 <input type="time" id="eEnd" step="300" style="width:auto"></span>
      <label>説明</label><textarea id="eDesc" rows="3"></textarea>
      <label>タスク</label><select id="eTask"></select>
      <label>カテゴリ</label><select id="eCat"></select>
    </div>
    <p class="hint">タスク・カテゴリは件名を変えずに予定へ記録され、集計で最優先されます。保存すると参加者への通知は送らず、その日の工数を取り込み直します。</p>
    <div class="mfoot">
      <a id="eLink" class="hint" target="_blank" style="margin-right:auto;align-self:center">Googleカレンダーで開く</a>
      <button class="sec" id="eCancel">キャンセル</button>
      <button class="pri" id="eSave">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h3 id="mTitle">タスク</h3>
    <div class="idbox" id="mId" hidden></div>
    <div class="fgrid">
      <label>タスク名 *</label><input type="text" id="tName">
      <label>案件</label><input type="text" id="tProj" list="projList">
      <label>担当者</label><select id="tOwner"></select>
      <label>カテゴリ</label><select id="tCat"></select>
      <label>ステータス</label><select id="tStatus"></select>
      <label>優先度</label><select id="tPrio"><option>高</option><option selected>中</option><option>低</option></select>
      <label>開始日</label><input type="date" id="tStart">
      <label>期限</label><input type="date" id="tDue">
      <label>予定工数(h)</label><input type="number" id="tPlan" min="0" step="0.5">
      <label>親タスク</label><select id="tParent"></select>
      <label>メモ</label><textarea id="tMemo" rows="3"></textarea>
    </div>
    <datalist id="projList"></datalist>
    <div class="mfoot">
      <button class="sec" id="mCancel">キャンセル</button>
      <button class="pri" id="mSave">保存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
var S = { data: null, view: 'board', editing: null };
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ng) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ng);
    r[fn].apply(r, args);
  });
}
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3000); }
function fail(e) { toast('エラー: ' + (e && e.message ? e.message : e)); }
function h1(x) { return x == null || x === '' ? '-' : (Math.round(x * 10) / 10).toFixed(1); }
function pct(x) { return x == null ? '-' : Math.round(x * 100) + '%'; }
function d2s(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function s2d(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function md(s) { if (!s) return ''; var p = s.split('-'); return (+p[1]) + '/' + (+p[2]); }
function addD(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function jcls(j) { return { '期限超過': 'j-bad', '工数超過': 'j-bad', '注意': 'j-warn', '完了': 'j-done' }[j] || 'j-ok'; }
function opts(arr, sel, blank) { return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') + arr.map(function (v) { return '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); }

// ---------- 起動 ----------
function load() {
  return api('getAppData').then(function (d) {
    S.data = d;
    $('#loading').hidden = true;
    $('#meta').textContent = '最終取込: ' + (d.lastImport || '未実行');
    fillFilters();
    render();
  }).catch(function (e) { $('#loading').textContent = '読み込みに失敗しました: ' + (e.message || e); });
}
function fillFilters() {
  var d = S.data, keep = { o: $('#fOwner').value, d: $('#fDept').value, p: $('#fProj').value };
  var projs = uniq(d.tasks.map(function (t) { return t.proj; }).filter(Boolean));
  $('#fOwner').innerHTML = opts(d.members.map(function (m) { return m.name; }), keep.o, 'すべて');
  $('#fDept').innerHTML = opts(d.depts.filter(Boolean), keep.d, 'すべて');
  $('#fProj').innerHTML = opts(projs, keep.p, 'すべて');
  $('#projList').innerHTML = projs.map(function (p) { return '<option value="' + esc(p) + '">'; }).join('');
  $('#tOwner').innerHTML = opts(d.members.map(function (m) { return m.name; }), '', '（未割当）');
  $('#tCat').innerHTML = opts(d.cats, '', '（未設定）');
  $('#tStatus').innerHTML = opts(d.statuses);
  if (!$('#rName').options.length) {
    $('#rName').innerHTML = opts(d.members.map(function (m) { return m.name; }), d.me);
    $('#rDate').value = d.today;
  }
  var calMembers = d.members.filter(function (m) { return m.calId && (d.isAdmin || m.calId.toLowerCase() === d.viewer); });
  var keepC = $('#cName').value || (d.members.find(function (m) { return m.name === d.me; }) || {}).calId || '';
  $('#cName').innerHTML = calMembers.map(function (m) { return '<option value="' + esc(m.calId) + '"' + (m.calId === keepC ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('');
  $('#tabAdmin').hidden = !d.isAdmin;
  $('#eCat').innerHTML = '<option value="">（自動判定）</option>' + opts(d.cats);
}
function uniq(a) { var o = {}; return a.filter(function (x) { return o[x] ? false : (o[x] = 1); }).sort(); }
function filtered() {
  var o = $('#fOwner').value, dp = $('#fDept').value, p = $('#fProj').value, q = $('#fQ').value.trim(), done = $('#fDone').checked;
  return S.data.tasks.filter(function (t) {
    if (t.level) return false;  // 業務分掌の大・中・小は「予実・工数」のツリーで表示
    if (!done && t.status === '完了') return false;
    if (o && t.owner !== o) return false;
    if (dp && t.dept !== dp) return false;
    if (p && t.proj !== p) return false;
    if (q && (t.id + t.name + t.proj + t.memo).indexOf(q) < 0) return false;
    return true;
  });
}
function render() {
  ['board', 'gantt', 'dash', 'daily', 'cal', 'admin'].forEach(function (v) { $('#v-' + v).hidden = v !== S.view; });
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S.view); });
  $('#filters').style.display = (S.view === 'board' || S.view === 'gantt' || S.view === 'dash') ? '' : 'none';
  if (S.view === 'board') renderBoard();
  if (S.view === 'gantt') renderGantt();
  if (S.view === 'dash') { if (!S.dash) dashPreset(); else renderDash(); }
  if (S.view === 'daily') loadDaily();
  if (S.view === 'cal') loadCal();
  if (S.view === 'admin') loadAdmin();
}

// ---------- ボード ----------
function cardHtml(t) {
  var rate = t.plan ? t.actual / t.plan : null;
  var bc = rate == null ? '' : rate > 1 ? 'over' : rate >= 0.8 ? 'warn' : '';
  var od = t.due && t.status !== '完了' && t.due < S.data.today;
  return '<div class="card p-' + esc(t.prio) + '" draggable="true" data-id="' + esc(t.id) + '">' +
    '<div class="c-top"><span>' + esc(t.id) + (t.cat ? ' ・ ' + esc(t.cat) : '') + '</span>' + (t.judge ? '<span class="badge ' + jcls(t.judge) + '">' + esc(t.judge) + '</span>' : '') + '</div>' +
    '<div class="c-name">' + (t.calEv ? '<span title="タスク用カレンダーから自動追加">📅 </span>' : '') + esc(t.name) + '</div>' +

function renderGantt() {
  var all = filtered(), ts = all.filter(function (t) { return t.start || t.due; });

  if (!ts.length) { el.innerHTML = '<p class="hint">開始日か期限が入ったタスクがありません。</p>'; return; }
  var today = s2d(S.data.today), min = addD(today, -7), max = addD(today, 28);
  ts.forEach(function (t) { var s = s2d(t.start || t.due), e = s2d(t.due || t.start); if (s < min) min = s; if (e > max) max = e; });
  if ((max - min) / 864e5 > 180) { min = addD(today, -30); max = addD(today, 150); }
  var W = 26, n = Math.round((max - min) / 864e5) + 1, width = n * W;
  var k = (6 - min.getDay() + 7) % 7, stops = [];
  for (var i = 0; i < 7; i++) { var we = i === k || i === (k + 1) % 7; stops.push((we ? '#eef0f5' : 'transparent') + ' ' + (i * W) + 'px ' + ((i + 1) * W) + 'px'); }
  var bg = 'background-image:repeating-linear-gradient(90deg,transparent 0 ' + (W - 1) + 'px,#e6e9ef ' + (W - 1) + 'px ' + W + 'px),repeating-linear-gradient(90deg,' + stops.join(',') + ');width:' + width + 'px';
  var todayX = Math.round((today - min) / 864e5) * W + W / 2;

  for (var j = 0; j < n; j++) {
    var d = addD(min, j);

    head += '<div class="gday" style="left:' + (j * W) + 'px;width:' + W + 'px;' + (d.getDay() % 6 === 0 ? 'color:#ffb3b3' : '') + '">' + d.getDate() + '</div>';
  }
  head += '</div></div>';
  var groups = {};

  var body = Object.keys(groups).sort().map(function (g) {
    var list = groups[g].sort(function (a, b) { return (a.start || a.due) < (b.start || b.due) ? -1 : 1; });
    return '<div class="grow gsec"><div class="glabel">■ ' + esc(g) + '（' + list.length + '件）</div><div class="gtl" style="width:' + width + 'px;height:22px"></div></div>' +
      list.map(function (t) {
        var s = s2d(t.start || t.due), e = s2d(t.due || t.start);
        if (e < s) { var tmp = s; s = e; e = tmp; }
        var x = Math.round((s - min) / 864e5) * W, w = (Math.round((e - s) / 864e5) + 1) * W;
        var rate = t.plan ? Math.min(1, t.actual / t.plan) : 0;
        var bad = t.judge === '期限超過' || t.judge === '工数超過';
        return '<div class="grow"><div class="glabel"><span class="hint">' + esc(t.id) + '</span><span class="nm" title="' + esc(t.name) + '">' + esc(t.name) + '</span><span class="hint">' + esc(t.owner) + '</span>' +
          (t.judge ? '<span class="badge ' + jcls(t.judge) + '">' + esc(t.judge) + '</span>' : '') + '</div>' +
          '<div class="gtl" style="' + bg + '"><div class="gtoday" style="left:' + todayX + 'px"></div>' +
          '<div class="gbar s-' + esc(t.status) + (bad ? ' bad' : '') + '" data-id="' + esc(t.id) + '" style="left:' + x + 'px;width:' + w + 'px" title="' + esc(t.name + ' ' + md(t.start) + '〜' + md(t.due) + ' 実績' + h1(t.actual) + 'h/予定' + h1(t.plan) + 'h') + '">' +
          '<i style="width:' + Math.round(rate * 100) + '%"></i><span>' + (t.plan ? pct(t.actual / t.plan) : '') + '</span></div></div></div>';
      }).join('');
  }).join('');
  el.innerHTML = '<p class="hint">バーの濃い部分＝実績工数の消化率。赤＝期限超過／工数超過。クリックで編集。' + (all.length > ts.length ? '（日付未設定 ' + (all.length - ts.length) + '件は非表示）' : '') + '</p>' +
    '<div class="gwrap">' + head + body + '</div>';
  var wrap = el.querySelector('.gwrap');

  wrap.addEventListener('click', function (e) { var b = e.target.closest('.gbar'); if (b) openEditor(b.dataset.id); });

function gyomuTreeHtml(d, mf) {
  var lvTasks = S.data.tasks.filter(function (t) { return t.level; });
  if (!lvTasks.length) return '';
  S.fold = S.fold || {};
  var th = d.taskHours || {}, kids = {};
  S.data.tasks.forEach(function (t) { if (t.level || t.parent) (kids[t.parent || ''] = kids[t.parent || ''] || []).push(t); });
  var roots = (kids[''] || []).filter(function (t) { return t.level === '大'; });
  var linked = 0;
  roots.forEach(function (t) { linked += th[t.id] || 0; });
  var maxPlan = Math.max.apply(null, lvTasks.map(function (t) { return t.plan || 0; }).concat([1]));
  var rows = '';
  (function rec(list, depth) {
    list.forEach(function (t) {
      var ch = kids[t.id] || [], open = !S.fold[t.id];
      var act = th[t.id] || 0, mon = act * mf, plan = t.plan || 0, diff = mon - plan;
      var cls = plan && mon > plan * 1.2 ? 'over' : plan && mon < plan * 0.5 ? 'under' : '';
      var w = Math.min(160, Math.round(mon / maxPlan * 160)), wp = Math.min(160, Math.round(plan / maxPlan * 160));
      rows += '<tr class="lv-' + (t.level || '個別') + '" data-tid="' + esc(t.id) + '">' +
        '<td style="padding-left:' + (6 + depth * 16) + 'px">' + (ch.length ? '<span class="tg" data-fold="' + esc(t.id) + '">' + (open ? '▾' : '▸') + '</span>' : '<span class="tg"></span>') +
        esc(t.name) + (t.level ? '' : ' <span class="hint">（' + esc(t.id) + '）</span>') + '</td>' +
        '<td>' + esc(t.owner) + '</td><td class="n">' + (plan ? h1(plan) : '-') + '</td><td class="n">' + h1(act) + '</td><td class="n hl">' + h1(mon) + '</td>' +
        '<td class="n ' + (plan ? (diff > 0 ? 'dpos' : 'dneg') : '') + '">' + (plan ? (diff > 0 ? '+' : '') + h1(diff) : '-') + '</td>' +
        '<td><span class="pv ' + cls + '" style="width:' + w + 'px"></span>' + (plan ? '<span class="pv under" style="width:2px;height:12px;margin-left:' + Math.max(0, wp - w) + 'px"></span>' : '') + '</td></tr>';
      if (open && ch.length) rec(ch, depth + 1);
    });
  })(roots, 0);
  var rest = Math.max(0, d.total - linked);
  return '<div class="panel" style="margin-top:14px"><h4>業務分掌 予実（大・中・小タスク）　<span class="hint">月間予定＝業務分掌の工数／実績はこの期間を月換算（×' + (Math.round(mf * 100) / 100) + '）。行クリックで編集、▾で開閉</span>' +
    ' <button class="sec" id="foldAll" style="padding:1px 8px">中まで表示</button> <button class="sec" id="openAll" style="padding:1px 8px">すべて開く</button></h4>' +
    '<table class="pt"><tr><th>業務</th><th>担当</th><th>月間予定(h)</th><th>期間実績(h)</th><th class="hl" style="color:#000">実績 月換算(h)</th><th>差(h/月)</th><th>予実（縦線＝予定）</th></tr>' + rows +
    '<tr class="tot"><td>業務分掌に未設定の工数</td><td></td><td></td><td class="n">' + h1(rest) + '</td><td class="n">' + h1(rest * mf) + '</td><td colspan="2" class="hint">カレンダータブで予定に小タスクを付けると減ります</td></tr></table></div>';
}

// ---------- カレンダー（予定の確認・修正） ----------
var WD = ['日', '月', '火', '水', '木', '金', '土'];
var CAT_COLORS = ['#3f7fd1', '#2e9d6a', '#8e6bc2', '#d1793f', '#c2477a', '#1f9bb0', '#6d8a2f', '#a0662b', '#5a6fd1', '#b0466a', '#3a8f8f', '#7a5bb5', '#c48a1f', '#4b7f52', '#8b5e3c'];
function catColor(c) { var i = S.data.cats.indexOf(c); return i < 0 ? '#9aa5b8' : CAT_COLORS[i % CAT_COLORS.length]; }
function accCls(a) { return a === '編集可' ? 'acc-ok' : a === '閲覧のみ' ? 'acc-ro' : (a === '空き時間のみ' || a === 'アクセス不可') ? 'acc-ng' : 'acc-na'; }
function mins(iso) { return +iso.slice(11, 13) * 60 + +iso.slice(14, 16); }
function endMin(e) { return e.end.slice(0, 10) > e.start.slice(0, 10) ? 24 * 60 : mins(e.end); }
function durH(e) { return (endMin(e) - mins(e.start)) / 60; }
function dayEvents(ds) { return S.cal.events.filter(function (e) { return e.start.slice(0, 10) === ds; }).sort(function (a, b) { return a.start < b.start ? -1 : 1; }); }
function dayHours(ds) { return dayEvents(ds).filter(function (e) { return !e.excluded; }).reduce(function (s, e) { return s + durH(e); }, 0); }
function treeOrder() {
  var kids = {}, out = [];
  S.data.tasks.filter(function (t) { return t.level; }).forEach(function (t) { (kids[t.parent || ''] = kids[t.parent || ''] || []).push(t); });
  (function rec(pid, depth) { (kids[pid] || []).forEach(function (t) { if (depth > 5) return; out.push({ t: t, depth: depth }); rec(t.id, depth + 1); }); })('', 0);
  return out;
}
var LV_MARK = { '大': '■ ', '中': '　▸ ', '小': '　　・' };
function parentOpts(sel, selfId) {
  return '<option value="">（なし）</option>' + treeOrder().filter(function (x) { return x.t.id !== selfId; }).map(function (x) {
    return '<option value="' + esc(x.t.id) + '"' + (x.t.id === sel ? ' selected' : '') + '>' + esc(LV_MARK[x.t.level] + x.t.name) + '</option>';
  }).join('');
}
function taskOpts(sel) {
  var ts = S.data.tasks.filter(function (t) { return !t.level && (t.status !== '完了' || t.id === sel); });
  var html = '<option value="">（なし）</option>';
  if (ts.length) html += '<optgroup label="個別タスク">' + ts.map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === sel ? ' selected' : '') + '>' + esc(t.id + ' ' + t.name) + '</option>'; }).join('') + '</optgroup>';
  var grp = '';
  treeOrder().forEach(function (x) {
    if (x.t.level === '大') { if (grp) html += '</optgroup>'; html += '<optgroup label="' + esc('■ ' + x.t.name) + '">'; grp = x.t.id; return; }
    html += '<option value="' + esc(x.t.id) + '"' + (x.t.id === sel ? ' selected' : '') + '>' + esc((x.t.level === '中' ? '▸ ' : '　・') + x.t.name) + '</option>';
  });
  return html + (grp ? '</optgroup>' : '');
}
function catOpts(e) {
  return '<option value="">（自動' + (e.manualCat ? '' : '：' + esc(e.cat)) + '）</option>' + S.data.cats.map(function (c) { return '<option' + (c === e.manualCat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
}
function loadCal() {
  if (!S.calWeek) S.calWeek = addD(s2d(S.data.today), -((s2d(S.data.today).getDay() + 6) % 7));
  var f = S.calWeek, t = addD(f, 6), calId = $('#cName').value;
  $('#cRange').textContent = (f.getMonth() + 1) + '/' + f.getDate() + ' 〜 ' + (t.getMonth() + 1) + '/' + t.getDate();
  if (!calId) { $('#calBody').innerHTML = '<p class="hint">表示できるメンバーがいません（管理者は「管理」タブで登録。一般メンバーは自分のカレンダーのみ表示）。</p>'; return; }
  $('#calBody').innerHTML = '<p class="hint">読み込み中…</p>';
  api('getEvents', calId, d2s(f), d2s(t)).then(function (d) { S.cal = d; renderCal(); })
    .catch(function (e) { $('#calBody').innerHTML = '<p class="hint">読み込めませんでした: ' + esc(e.message || e) + '</p>'; });
}
function renderCal() {
  var d = S.cal, f = S.calWeek, PX = 40, hs = 8, he = 19;
  $('#cAccess').innerHTML = 'アクセス: <span class="acc ' + accCls(d.access) + '">' + esc(d.access || '未確認') + '</span>';
  d.events.forEach(function (e) { hs = Math.min(hs, Math.floor(mins(e.start) / 60)); he = Math.max(he, Math.ceil(endMin(e) / 60)); });
  var H = (he - hs) * PX, days = [];

  var html = '<div class="week"><div class="wk-h"></div>';
  days.forEach(function (x) { var ds = d2s(x); html += '<div class="wk-h' + (ds === S.data.today ? ' today' : '') + '">' + (x.getMonth() + 1) + '/' + x.getDate() + '(' + WD[x.getDay()] + ')<small>' + h1(dayHours(ds)) + 'h</small></div>'; });
  html += '<div class="wk-t" style="height:' + H + 'px">';
  for (var h = hs; h < he; h++) html += '<div style="top:' + ((h - hs) * PX) + 'px">' + h + ':00</div>';
  html += '</div>';
  days.forEach(function (x) {
    var evs = dayEvents(d2s(x)), lanes = [];
    evs.forEach(function (e) {
      var s = mins(e.start), li = lanes.findIndex(function (end) { return end <= s; });
      if (li < 0) { li = lanes.length; lanes.push(0); }
      lanes[li] = endMin(e); e._lane = li;
    });
    var n = Math.max(1, lanes.length);
    html += '<div class="wk-d' + (x.getDay() % 6 === 0 ? ' we' : '') + '" style="height:' + H + 'px">';
    evs.forEach(function (e) {
      var s = mins(e.start), top = (s - hs * 60) / 60 * PX, ht = Math.max(16, (endMin(e) - s) / 60 * PX - 2);
      var cls = e.excluded ? ' exc' : e.cat === '未分類' ? ' unc' : '';
      if (e.manualTask || e.manualCat) cls += ' man';
      var tm = e.start.slice(11) + '-' + e.end.slice(11);
      html += '<div class="ev' + cls + '" data-id="' + esc(e.id) + '" style="top:' + top + 'px;height:' + ht + 'px;left:calc(' + (e._lane * 100 / n) + '% + 2px);width:calc(' + (100 / n) + '% - 4px);background:' + catColor(e.cat) + '" title="' + esc(tm + ' ' + e.title + ' [' + (e.excluded || e.cat) + ']') + '">' +
        '<b>' + esc(e.title || '（件名なし）') + '</b>' + tm + '<br>' + esc(e.excluded ? '対象外：' + e.excluded : e.cat + (e.task ? ' ' + e.task : '')) + '</div>';

  html += '<div class="panel" style="margin-top:10px"><h4>分類の修正（選ぶとすぐ保存・件名は変わりません）</h4><table class="pt"><tr><th>時間</th><th>h</th><th>件名</th><th>カテゴリ</th><th>タスク</th><th>判定方法</th><th></th></tr>';
  var any = false;
  days.forEach(function (x) {
    var ds = d2s(x), evs = dayEvents(ds);
    if (!evs.length) return;
    any = true;
    html += '<tr class="sec"><td colspan="7">■ ' + md(ds) + '(' + WD[x.getDay()] + ')（' + evs.length + '件・' + h1(dayHours(ds)) + 'h）</td></tr>';
    evs.forEach(function (e) {
      html += '<tr data-eid="' + esc(e.id) + '"><td class="c">' + e.start.slice(11) + '-' + e.end.slice(11) + '</td><td class="n">' + h1(durH(e)) + '</td><td>' + esc(e.title || '（件名なし）') + '</td>' +
        (e.excluded ? '<td colspan="3" class="hint">集計対象外（' + esc(e.excluded) + '）</td>' :
          '<td' + (e.cat === '未分類' ? ' class="hl"' : '') + '><select data-k="cat">' + catOpts(e) + '</select></td><td><select data-k="task">' + taskOpts(e.manualTask || e.task) + '</select></td><td class="c hint">' + esc(e.how) + '</td>') +
        '<td class="c"><button class="sec" data-k="edit" style="padding:1px 8px">修正</button></td></tr>';
